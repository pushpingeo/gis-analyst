name: Worker secrets check
# Harmless: reports which secrets are set and whether the Cloudflare token and Anthropic key work.
# Read-only calls only (token verify, list Workers, list models); nothing is deployed or billed.
on:
  workflow_dispatch:
  push:
    paths: ['.github/worker-check-request']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Which secrets are set
        env:
          S1: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          S2: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          S3: "${{ secrets.ANTHROPIC_API_KEY }}"
          S4: "${{ secrets.ATLAS_MCP_KEY }}"
          S5: "${{ secrets.TOBLER_ANTHROPIC_API_KEY }}"
          S6: "${{ secrets.WORKER_ANTHROPIC_API_KEY }}"
          S7: "${{ secrets.ANTHROPIC_KEY }}"
          S8: "${{ secrets.CF_API_TOKEN }}"
          S9: "${{ secrets.CF_ACCOUNT_ID }}"
          S10: "${{ secrets.CLOUDFLARE_TOKEN }}"
        run: |
          names=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY ATLAS_MCP_KEY TOBLER_ANTHROPIC_API_KEY WORKER_ANTHROPIC_API_KEY ANTHROPIC_KEY CF_API_TOKEN CF_ACCOUNT_ID CLOUDFLARE_TOKEN)
          for i in $(seq 1 10); do v="S$i"; if [ -n "${!v}" ]; then echo "set:     ${names[$((i-1))]}"; else echo "missing: ${names[$((i-1))]}"; fi; done
      - name: Cloudflare token
        env:
          TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          ACCOUNT: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        run: |
          echo "--- user token verify"; curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $TOKEN" | jq -c '{success, status: .result.status, errors}'
          echo "--- account token verify"; curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify" -H "Authorization: Bearer $TOKEN" | jq -c '{success, status: .result.status, errors}'
          echo "--- workers on the account"; curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts" -H "Authorization: Bearer $TOKEN" | jq -c '{success, errors, scripts: [.result[]?.id]}'
          echo "--- workers.dev subdomain"; curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/subdomain" -H "Authorization: Bearer $TOKEN" | jq -c '{success, errors, subdomain: .result.subdomain}'
      - name: Anthropic key (lists models; no tokens used)
        env:
          K1: "${{ secrets.ANTHROPIC_API_KEY }}"
          K2: "${{ secrets.TOBLER_ANTHROPIC_API_KEY }}"
          K3: "${{ secrets.WORKER_ANTHROPIC_API_KEY }}"
          K4: "${{ secrets.ANTHROPIC_KEY }}"
        run: |
          for v in K1 K2 K3 K4; do
            [ -z "${!v}" ] && continue
            code=$(curl -s -o /tmp/m.json -w '%{http_code}' https://api.anthropic.com/v1/models -H "x-api-key: ${!v}" -H "anthropic-version: 2023-06-01")
            echo "$v: HTTP $code, haiku-5-5 listed: $(jq '[.data[]?.id] | index("claude-haiku-5-5") != null' /tmp/m.json)"
          done

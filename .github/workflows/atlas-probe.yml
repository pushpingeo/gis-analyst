name: Atlas probe
# Diagnostic calls to the AI Living World Atlas. Uses ATLAS_MCP_KEY; no Anthropic cost.
on:
  workflow_dispatch:
    inputs:
      calls: { description: 'JSON array of [tool, args] pairs', required: false, default: '' }
      urls: { description: 'JSON array of URLs to GET', required: false, default: '' }
      searches: { description: 'JSON array of Tobler searches to run', required: false, default: '' }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - if: inputs.calls == '' && inputs.urls == '' && inputs.searches == ''
        run: node scripts/probe-atlas.mjs
        env: { ATLAS_MCP_KEY: "${{ secrets.ATLAS_MCP_KEY }}" }
      - if: inputs.calls != '' || inputs.urls != '' || inputs.searches != ''
        run: node scripts/atlas-call.mjs
        env: { ATLAS_MCP_KEY: "${{ secrets.ATLAS_MCP_KEY }}", CALLS: "${{ inputs.calls }}", URLS: "${{ inputs.urls }}", SEARCHES: "${{ inputs.searches }}" }

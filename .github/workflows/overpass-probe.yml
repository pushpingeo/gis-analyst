name: Overpass probe
# Checks which public OpenStreetMap Overpass servers answer from GitHub's runners. No API key, no cost.
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-overpass.mjs

name: Place-finding evaluation
on:
  workflow_dispatch:
    inputs:
      args:
        description: "e.g. --label=pf-v1 --sites=10"
        required: true
        default: "--label=pf-dev --sites=10"
  push:
    branches: [main]
    paths: [".github/place-eval-request"]
permissions:
  contents: write
concurrency: place-evaluation
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - name: Run place-finding evaluation
        timeout-minutes: 80
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/run-place-eval.mjs ${{ github.event.inputs.args }} $(cat .github/place-eval-request 2>/dev/null | grep -v '^#' || true)
      - name: Commit results (even if the run stopped early)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A eval/places
          git diff --cached --quiet || git commit -m "Place-finding evaluation results"
          git pull --rebase && git push

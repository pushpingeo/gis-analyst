name: Place-finding evaluation
on:
  workflow_dispatch:
    inputs:
      args:
        description: "e.g. --label=pf-v1 --sites=10"
        required: true
        default: "--label=pf-dev --sites=10"
  push:
    branches: [main]
    paths: [".github/place-eval-request"]
permissions:
  contents: write
concurrency: place-evaluation
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - name: Run place-finding evaluation
        timeout-minutes: 190
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLAS_MCP_KEY: ${{ secrets.ATLAS_MCP_KEY }}
        # One run per line of the request file (or the manual arguments).
        run: |
          if [ -n "${{ github.event.inputs.args }}" ]; then node scripts/run-place-eval.mjs ${{ github.event.inputs.args }}; exit; fi
          grep -v '^#' .github/place-eval-request | grep -v '^\s*$' | while read -r line; do echo "== $line"; node scripts/run-place-eval.mjs $line; done
      - name: Commit results (even if the run stopped early)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A eval/places
          git diff --cached --quiet || git commit -m "Place-finding evaluation results"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done

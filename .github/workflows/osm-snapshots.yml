name: OSM snapshots for evaluation sites
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments, e.g. --force or --only=41172,45837"
        required: false
        default: ""
  push:
    branches: [main]
    paths: [".github/snapshot-request"]
permissions:
  contents: write
concurrency: osm-snapshots
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: node scripts/fetch-snapshots.mjs ${{ github.event.inputs.args }} $(cat .github/snapshot-request 2>/dev/null | grep -v '^#' || true)
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git diff --cached --quiet || git commit -m "OSM snapshots for evaluation sites"
          git pull --rebase && git push

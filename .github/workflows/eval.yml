name: Evaluation against IFC
on:
  workflow_dispatch:
    inputs:
      args:
        description: "e.g. --label=v1 --arms=rules,off,on,web --repeats=1 --sites=all"
        required: true
        default: "--label=dev --arms=rules,off,on --sites=all"
  push:
    branches: [main]
    paths: [".github/eval-request"]
permissions:
  contents: write
concurrency: evaluation
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npm test
      - name: Run evaluation
        timeout-minutes: 100
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/run-eval.mjs ${{ github.event.inputs.args }} $(cat .github/eval-request 2>/dev/null | grep -v '^#' || true)
      - name: Commit results (even if the run stopped early)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A eval
          git diff --cached --quiet || git commit -m "Evaluation results"
          git pull --rebase && git push

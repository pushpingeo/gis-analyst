<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tobler</title>
<meta name="description" content="Mark an area on the map or describe it, and an AI analyst works through it with open data and written-down GIS methods.">

 "skills/ntr-screening/SKILL.md": "skills/ntr-screening/SKILL.md?v=f5c4904b",
 "skills/place-finding/SKILL.md": "skills/place-finding/SKILL.md?v=371f40d1",

</head>
<body>
<div id="map" aria-label="Map"></div>

<nav class="tools" aria-label="Drawing tools">
  <button data-mode="select" aria-pressed="false" title="Select and edit">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.6L10 19z"/></svg><span class="sr">Select and edit</span></button>
  <button data-mode="point" aria-pressed="false" title="Drop a point">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-6.2-6-11a6 6 0 0112 0c0 4.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg><span class="sr">Drop a point</span></button>
  <button data-mode="linestring" aria-pressed="false" title="Draw a line">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l6-8 4 4 6-9"/><circle cx="4" cy="18" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="14" cy="14" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg><span class="sr">Draw a line</span></button>
  <button data-mode="polygon" aria-pressed="false" title="Draw an area">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7l8-3 7 6-3 9-11-2z"/></svg><span class="sr">Draw an area</span></button>
  <button data-mode="rectangle" aria-pressed="false" title="Draw a rectangle">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12"/></svg><span class="sr">Draw a rectangle</span></button>
  <button data-mode="circle" aria-pressed="false" title="Draw a circle">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.2"/></svg><span class="sr">Draw a circle</span></button>
  <span class="tools-gap"></span>
  <button data-action="delete" title="Delete the selected shape" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span class="sr">Delete the selected shape</span></button>
</nav>

<p class="hint" id="hint" hidden></p>

<section class="panel" id="panel" aria-label="Conversation">
  <button class="handle" id="handle" aria-expanded="true" aria-controls="conversation"><span class="sr">Show or hide the conversation</span></button>
  <header class="brand">
    <h1><img class="mark" src="img/tobler.svg" alt="" width="30" height="30">Hi, I'm Tobler</h1>
    <p>Your GIS analyst, on call.</p>
  </header>

  <div class="conversation" id="conversation" aria-live="polite">
    <div class="msg analyst welcome">
      <p class="lead">Pick a spot on Earth.</p>
      <p>Tell me where, roughly is fine. I'll pin it down and show my working.</p>
      <ul class="examples">
        <li><button data-example>Box off 3 km² around Jackdaw</button></li>
        <li><button data-example>Show me block 30/2</button></li>
        <li><button data-example>5 km round Linlithgow Palace</button></li>
      </ul>
    </div>
  </div>

  <div class="composer">
    <p class="activity" id="activity" role="status"></p>
    <div class="chips" role="group" aria-label="What to do">
      <button class="chip" data-prompt="Find ">Find a place</button>
      <button class="chip" data-draw="polygon">Draw an area</button>
      <button class="chip soon" data-soon aria-describedby="soon-note">Screen for risks <span>· soon</span></button>
      <button class="chip soon" data-soon aria-describedby="soon-note">Net area <span>· soon</span></button>
      <button class="chip soon" data-soon aria-describedby="soon-note">Constraints <span>· soon</span></button>
      <span id="soon-note" class="sr">Coming soon</span>
    </div>
    <form class="ask" id="ask">
      <label for="say" class="sr">Message</label>
      <textarea id="say" rows="1" placeholder="Where should we look?" autocomplete="off"></textarea>
      <button type="button" class="mic" id="mic" title="Speak" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg><span class="sr">Speak</span></button>
      <button type="submit" class="send" title="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg><span class="sr">Send</span></button>
    </form>
    <p class="links"><a href="lab.html">How the risk screening was tested</a><a href="index.html">Earlier agent page</a><a href="https://github.com/pushpingeo/tobler">Code</a></p>
  </div>
</section>

<template id="shape-card">
  <article class="msg analyst shape">
    <header>
      <h2></h2>
      <span class="badge"></span>
      <div class="scale" role="radiogroup" aria-label="Scale of work">
        <button role="radio" data-scale="local">Local</button>
        <button role="radio" data-scale="regional">Regional</button>
        <button role="radio" data-scale="global">Global</button>
      </div>
    </header>
    <p class="summary"></p>
    <details class="origin"><summary></summary><div></div></details>
    <dl class="facts"></dl>
    <div class="edit">
      <button data-op="zoom">Zoom to</button>
      <button data-op="rotate" data-deg="-15" title="Rotate 15° anticlockwise" aria-label="Rotate 15 degrees anticlockwise">↺ 15°</button>
      <button data-op="rotate" data-deg="15" title="Rotate 15° clockwise" aria-label="Rotate 15 degrees clockwise">↻ 15°</button>
      <form class="resize"><label><span class="sr">New size</span><input type="number" min="0" step="any" inputmode="decimal"></label><span class="unit"></span><button>Resize</button></form>
    </div>
    <ol class="history"></ol>
    <div class="proposal" hidden>
      <p>Is this the area you meant?</p>
      <button data-op="accept" class="primary">Use this area</button>
      <button data-op="revise">Not quite</button>
    </div>
  </article>
</template>

<template id="choice-card">
  <article class="msg analyst choices" aria-roledescription="carousel">
    <p class="question"></p>
    <div class="option" aria-live="polite">
      <p class="rec" hidden><span class="badge">Recommended</span> <span class="why"></span></p>
      <h2></h2>
      <p class="kind"></p>
      <p class="src"></p>
      <p class="detail"></p>
    </div>
    <div class="nav">
      <button data-op="prev" aria-label="Previous option">‹</button>
      <span class="count"></span>
      <button data-op="next" aria-label="Next option">›</button>
    </div>
    <div class="pick">
      <button data-op="use" class="primary">Use this one</button>
      <button data-op="lucky">Use the recommended one</button>
    </div>
  </article>
</template>

<script type="module" src="js/workspace.js?v=57447d3d"></script>
</body>
</html>

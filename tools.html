<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIS Analyst: spatial tools check</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="importmap">
{ "imports": {
  "@turf/turf": "https://esm.sh/@turf/turf@7.2.0",
  "osmtogeojson": "https://esm.sh/osmtogeojson@3.0.0-beta.5"
} }
</script>
<style>
  .muted { color: #5b6575; font-size: 13px; }
  h3 { font-size: 14px; margin: 16px 0 4px; }
  :root { --ink:#1d2430; --muted:#5b6575; --line:#e3e6eb; --bg:#f7f8fa; --accent:#0b6e4f; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { margin:0; font-size:17px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 1fr 420px; height: calc(100vh - 62px); }
  #map { height:100%; }
  aside { overflow:auto; background:#fff; border-left:1px solid var(--line); padding:12px 14px; }
  .controls { display:grid; gap:8px; margin-bottom:10px; }
  select, input, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .status { color:var(--muted); font-size:13px; min-height:1.4em; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 12px; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .ps { font-weight:600; white-space:nowrap; }
  .ifc { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  details { margin-top:8px; } pre { white-space:pre-wrap; font-size:11px; background:var(--bg); padding:8px; border-radius:6px; max-height:300px; overflow:auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 45vh auto; height:auto; } aside { border-left:0; } }
</style>
</head>
<body>
<header>
  <h1>GIS Analyst: spatial tools check</h1>
  <p>No AI yet. Pick a site, and the tools pull OpenStreetMap features, GBIF threatened species records and Wikidata places around it and measure distances.</p>
</header>
<main>
  <div id="map"></div>
  <aside>
    <div class="controls">
      <select id="site"></select>
      <div class="row">
        <label>Asset type <select id="asset"></select></label>
        <label>Footprint km <input id="radius" type="number" step="0.5" min="0"></label>
      </div>
      <label style="font-size:13px"><input type="checkbox" id="useSnap" checked> Use the saved snapshot if there is one (repeatable); otherwise query the services live</label>
      <button id="run">Run tools</button>
      <div class="status" id="status"></div>
    </div>
    <div id="ifc"></div>
    <div id="results"></div>
    <div id="species"></div>
    <div id="places"></div>
    <details><summary>Overpass query</summary><pre id="query"></pre></details>
    <details><summary>Summary JSON (what the agent will see)</summary><pre id="json"></pre></details>
  </aside>
</main>
<script type="module">
import { buildOverpassQuery, fetchOverpass, screen, summarise, FOOTPRINT_KM, OVERPASS_ENDPOINTS,
  gbifUrl, slimGbif, summariseGbif, wikidataUrl, summariseWikidata } from "./js/tools.js?v=m2b";
import * as turf from "@turf/turf";
import osmtogeojson from "osmtogeojson";

const COLOURS = { PS5: "#c2410c", PS6: "#15803d", PS7: "#7c3aed", PS8: "#b45309", PS4: "#475569", "PS6 / PS8": "#0e7490" };
const $ = (id) => document.getElementById(id);

const [catalogue, evalSites] = await Promise.all([
  fetch("catalogue/catalogue.json").then((r) => r.json()),
  fetch("data/eval-sites.json").then((r) => r.json()),
]);
const sites = evalSites.sites;
$("site").innerHTML = sites.map((s, i) => `<option value="${i}">${s.name} (${s.country})</option>`).join("");
$("asset").innerHTML = Object.keys(FOOTPRINT_KM).map((a) => `<option>${a}</option>`).join("");

window.addEventListener("error", (e) => { $("status").textContent = "Error: " + e.message; });
window.addEventListener("unhandledrejection", (e) => { $("status").textContent = "Error: " + (e.reason && e.reason.message || e.reason); });

// The tools must work even if the map can't draw (no WebGL, background tab).
let map = null;
let mapReady = Promise.resolve(false);
try {
  map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/positron", center: [0, 20], zoom: 2 });
  map.addControl(new maplibregl.NavigationControl(), "top-right");
  mapReady = new Promise((r) => { map.on("load", () => r(true)); map.on("error", () => {}); });
} catch (e) {
  $("map").innerHTML = `<p style="padding:16px;color:#5b6575">Map unavailable here (${e.message}). The tools still run.</p>`;
}

function pickSite() {
  const s = sites[+$("site").value];
  $("asset").value = s.asset_type;
  $("radius").value = FOOTPRINT_KM[s.asset_type];
  const ps = ["ps5", "ps6", "ps7", "ps8"].map((k) => `${k.toUpperCase()} ${s.ifc[k] ? "yes" : "no"}`).join(" · ");
  $("ifc").innerHTML = `<div class="ifc"><b>IFC's answer (for checking only):</b> Category ${s.ifc.category} · ${ps}<br><a href="${s.esrs_url}" target="_blank" rel="noopener">IFC review summary</a></div>`;
  for (const id of ["results", "species", "places"]) $(id).innerHTML = "";
  $("status").textContent = "";
  drawSite(s, +$("radius").value);
}
$("site").onchange = pickSite;
$("asset").onchange = () => { $("radius").value = FOOTPRINT_KM[$("asset").value]; };

async function drawSite(s, r) {
  if (!map || !(await mapReady)) return;
  const foot = r > 0 ? turf.circle([s.lon, s.lat], r, { units: "kilometers" }) : turf.point([s.lon, s.lat]);
  const ring20 = turf.circle([s.lon, s.lat], r + 20, { units: "kilometers" });
  setSource("site", turf.featureCollection([foot, turf.point([s.lon, s.lat])]));
  setSource("ring", ring20);
  setSource("osm", turf.featureCollection([]));
  map.fitBounds(turf.bbox(turf.circle([s.lon, s.lat], r + 6, { units: "kilometers" })), { padding: 20, duration: 0 });
}

function setSource(id, data) {
  if (!map || !map.isStyleLoaded()) return;
  if (map.getSource(id)) { map.getSource(id).setData(data); return; }
  map.addSource(id, { type: "geojson", data });
  if (id === "ring") map.addLayer({ id, source: id, type: "line", paint: { "line-color": "#64748b", "line-dasharray": [2, 2] } });
  if (id === "site") {
    map.addLayer({ id: "site-fill", source: id, type: "fill", filter: ["==", "$type", "Polygon"], paint: { "fill-color": "#0b6e4f", "fill-opacity": 0.12 } });
    map.addLayer({ id: "site-pt", source: id, type: "circle", filter: ["==", "$type", "Point"], paint: { "circle-radius": 6, "circle-color": "#0b6e4f", "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
  }
  if (id === "osm") {
    const c = ["match", ["get", "_ps"], ...Object.entries(COLOURS).flat(), "#999"];
    map.addLayer({ id: "osm-fill", source: id, type: "fill", filter: ["==", "$type", "Polygon"], paint: { "fill-color": c, "fill-opacity": 0.2 } }, "site-fill");
    map.addLayer({ id: "osm-line", source: id, type: "line", paint: { "line-color": c, "line-width": 1.5 } }, "site-fill");
    map.addLayer({ id: "osm-pt", source: id, type: "circle", filter: ["==", "$type", "Point"], paint: { "circle-radius": 4, "circle-color": c } }, "site-fill");
  }
}

$("run").onclick = async () => {
  const s = sites[+$("site").value];
  const r = +$("radius").value;
  $("run").disabled = true;
  drawSite(s, r);
  const useSnap = $("useSnap").checked && r === FOOTPRINT_KM[s.asset_type];
  const extras = loadExtras(s, r, useSnap);
  const q = buildOverpassQuery(catalogue, s.lon, s.lat, r);
  $("query").textContent = q;
  let osm, lastErr; const errors = [];
  if (useSnap) {
    try {
      const snap = await fetch(`data/osm/${s.id}.json`).then((x) => (x.ok ? x.json() : null));
      if (snap) {
        osm = snap.osm;
        $("query").textContent = snap.query;
        $("status").textContent = `${osm.elements.length} OSM elements from the snapshot saved ${snap.fetched.slice(0, 10)} (${new URL(snap.endpoint).host}).` +
          (snap.catalogue_version !== catalogue.version ? ` Snapshot uses catalogue ${snap.catalogue_version}, so newer concepts show as none found until it's refreshed.` : "");
      }
    } catch (e) { /* fall through to live */ }
  }
  for (const ep of osm ? [] : OVERPASS_ENDPOINTS) {
    try {
      $("status").textContent = `Querying ${new URL(ep).host}…`;
      const t0 = performance.now();
      osm = await fetchOverpass(q, ep);
      $("status").textContent = `${osm.elements.length} OSM elements in ${((performance.now() - t0) / 1000).toFixed(1)} s from ${new URL(ep).host}.`;
      break;
    } catch (e) { lastErr = new Error(`${new URL(ep).host}: ${e.message.slice(0, 80)}`); errors.push(lastErr.message); }
  }
  $("run").disabled = false;
  if (!osm) { $("status").textContent = "Overpass failed. " + errors.join(" | "); return; }

  const result = screen(osm, catalogue, s.lon, s.lat, r);
  const summary = summarise(result);
  window.lastResult = { site: s, footprint_km: r, summary, result };
  $("json").textContent = JSON.stringify(summary, null, 1);
  renderTable(summary);
  if (map) mapReady.then((ok) => ok && drawOsm(osm));
  const { species, places, notes } = await extras;
  summary["threatened-species"] = species;
  summary["named-places"] = places;
  $("json").textContent = JSON.stringify(summary, null, 1);
  renderSpecies(species, notes.gbif);
  renderPlaces(places, notes.wikidata);
};

// GBIF and Wikidata: from the saved snapshot if there is one, otherwise live.
async function loadExtras(s, r, useSnap) {
  const notes = {};
  const snapOf = async (dir) => (useSnap ? fetch(`data/${dir}/${s.id}.json`).then((x) => (x.ok ? x.json() : null)).catch(() => null) : null);
  const get = async (url) => { const x = await fetch(url, { headers: { Accept: "application/json" } }); if (!x.ok) throw new Error(`${x.status}`); return x.json(); };
  let species = null, places = null;
  try {
    const snap = await snapOf("gbif");
    if (snap) { species = summariseGbif(snap.near, snap.wide, s.lon, s.lat, r); notes.gbif = `snapshot saved ${snap.fetched.slice(0, 10)}`; }
    else {
      const [near, wide] = await Promise.all([get(gbifUrl(s.lon, s.lat, r + 5)), get(gbifUrl(s.lon, s.lat, r + 20, { facetOnly: true }))]);
      species = summariseGbif(slimGbif(near), wide, s.lon, s.lat, r); notes.gbif = "live";
    }
  } catch (e) { notes.gbif = "GBIF failed: " + e.message; }
  try {
    const snap = await snapOf("wikidata");
    if (snap) { places = summariseWikidata(snap.wikidata, r); notes.wikidata = `snapshot saved ${snap.fetched.slice(0, 10)}`; }
    else { places = summariseWikidata(await get(wikidataUrl(s.lon, s.lat, r + 20)), r); notes.wikidata = "live"; }
  } catch (e) { notes.wikidata = "Wikidata failed: " + e.message; }
  return { species, places, notes };
}

const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderSpecies(g, note) {
  if (!g) { $("species").innerHTML = `<h3>Threatened species records</h3><p class="muted">${esc(note)}</p>`; return; }
  const rows = g.species.slice(0, 12).map((x) => `<tr><td><b>${x.category}</b></td><td><i>${esc(x.species)}</i>${x.common_name ? `<br>${esc(x.common_name)}` : ""}</td><td>${x.nearest_km} km<br><span class="muted">${x.records} record${x.records > 1 ? "s" : ""}, latest ${x.latest_year ?? "?"}</span></td></tr>`);
  $("species").innerHTML = `<h3>Threatened species records (CR, EN) within 5 km</h3>
  <p class="muted">${g.records_found} records${g.truncated ? `, first ${g.records_read} read` : ""}; ${g.wider_20km ? `${g.wider_20km.species} species within 20 km` : ""} · ${esc(note)}</p>
  ${rows.length ? `<table><tr><th>Cat.</th><th>Species</th><th>Nearest</th></tr>${rows.join("")}</table>` : `<p class="muted">No records found. That is not evidence of absence.</p>`}
  <p class="muted" style="font-size:12px">Source: GBIF.org occurrence records, filtered by IUCN Red List category. Records, not ranges.</p>`;
}

function renderPlaces(w, note) {
  if (!w) { $("places").innerHTML = `<h3>Named places (Wikidata)</h3><p class="muted">${esc(note)}</p>`; return; }
  const rows = w.items.filter((x) => x.name).slice(0, 15).map((x) => `<tr><td>${x.wikipedia ? `<a href="${esc(x.wikipedia)}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name)}${x.heritage ? `<br><span class="muted">${esc(x.heritage)}</span>` : ""}</td><td class="muted">${esc(x.types.slice(0, 2).join(", "))}</td><td>${x.distance_km} km</td></tr>`);
  $("places").innerHTML = `<h3>Named places for desk research (Wikidata)</h3><p class="muted">${w.items.length} items within 20 km · ${esc(note)}</p>
  <table><tr><th>Name</th><th>Type</th><th>Distance</th></tr>${rows.join("")}</table>
  <p class="muted" style="font-size:12px">Source: Wikidata (CC0). Point locations only.</p>`;
}

function renderTable(summary) {
  const rows = Object.values(summary).map((v) => {
    const near = v.nearest.length ? v.nearest.map((f) => `${f.name || "<i>unnamed</i>"} <span style="color:#5b6575">${f.type}, ${f.distance_km} km</span>`).join("<br>") : "<span style='color:#5b6575'>none found</span>";
    const c = v.counts;
    return `<tr><td class="ps"><span class="dot" style="background:${COLOURS[v.ps]}"></span>${v.ps}</td><td><b>${v.label}</b><br><span style="color:#5b6575">on site ${c.on_site} · ≤1 km ${c.near} · 1–5 km ${c.close} · 5–20 km ${c.wider}</span></td><td>${near}</td></tr>`;
  });
  $("results").innerHTML = `<table><tr><th>PS</th><th>Concept (searched)</th><th>Nearest</th></tr>${rows.join("")}</table>
  <p style="color:#5b6575;font-size:12px">Distances are from the footprint edge. Source: © OpenStreetMap contributors (ODbL). Missing features are not evidence of absence.</p>`;
}

function drawOsm(osm) {
  const fc = osmtogeojson({ ...osm, elements: osm.elements.filter((e) => e.lat !== undefined || e.geometry || (e.members || []).length) });
  for (const f of fc.features) {
    const p = f.properties;
    const hit = Object.values(catalogue.concepts).find((c) => c.match && c.match.some(([k, v]) => p[k] !== undefined && (v === "*" || p[k] === v)));
    p._ps = hit ? hit.ps : "";
  }
  setSource("osm", fc);
}

pickSite();
</script>
</body>
</html>
